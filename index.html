<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* BACKGROUND */
:root {
    --bg1:#550079;
    --bg2:linear-gradient(180deg,#091442 50%,#797d0a 100%);
    --pattern:url("https://image2url.com/r2/default/images/1771611268262-cf527bad-8bbd-40ca-8d2b-e2bc534bb656.png");
}

body{
    display:flex;
    min-height:100vh;
    color:white;
    background:var(--bg1);
    position:relative;
    overflow-x:hidden;
}

/* texture */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:var(--pattern);
    background-repeat:repeat;
    opacity:0.2;
    z-index:-2;
}

/* gradient */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:var(--bg2);
    opacity:0.75;
    z-index:-1;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    height:100vh;
    position:fixed;
    background:rgba(21,25,34,0.9);
    backdrop-filter:blur(8px);
    padding:20px;
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.nav button{
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border:none;
    background:none;
    color:#aaa;
    text-align:left;
    cursor:pointer;
    border-radius:8px;
}

.nav button:hover{
    background:#222836;
    color:white;
}

/* MAIN */
.main{
    margin-left:220px;
    padding:30px;
    width:100%;
    position:relative;
    z-index:5;
}

/* SECTIONS */
.section{
    display:none;
}

.section.active{
    display:block;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:20px;
}

/* CARD */
.card{
    background:rgba(21,25,34,0.9);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:white;
    transition:.2s;
    border:1px solid rgba(255,255,255,0.08);
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:120px;
    object-fit:cover;
}

.card h3{
    padding:10px;
}

.card p{
    padding:0 10px 12px;
    color:#aaa;
    font-size:14px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">⚡ My Hub</div>

    <div class="nav">
        <button onclick="show('home')">Home</button>
        <button onclick="show('games')">Games</button>
        <button onclick="show('proxies')">Proxies</button>
        <button onclick="show('tools')">Tools</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <div id="home" class="section active">
        <h1>Welcome</h1>
        <p>Select a category.</p>
    </div>

    <div id="games" class="section">
        <h1>🎮 Games</h1>
        <div class="grid" id="gamesGrid"></div>
    </div>

    <div id="proxies" class="section">
        <h1>🌐 Proxies</h1>
        <div class="grid">
            <a class="card" href="https://example.com" target="_blank">
                <img src="https://via.placeholder.com/300x120">
                <h3>Proxy 1</h3>
                <p>Open web proxy</p>
            </a>
        </div>
    </div>

    <div id="tools" class="section">
        <h1>🛠️ Tools</h1>
        <div class="grid">
            <a class="card" href="#">
                <img src="https://via.placeholder.com/300x120">
                <h3>Calculator</h3>
                <p>Simple tool</p>
            </a>
        </div>
    </div>

</div>

<script>
function show(page){
    document.querySelectorAll(".section").forEach(s=>{
        s.classList.remove("active");
    });
    document.getElementById(page).classList.add("active");
}

/* ===== GAME DATA ===== */
const games = [
    {
        name:"Snake",
        desc:"Classic snake game",
        img:"images/snake.png",
        link:"games/snake.html"
    },
    {
        name:"Tetris",
        desc:"Block puzzle game",
        img:"images/tetris.png",
        link:"games/tetris.html"
    }
];

/* RENDER GAMES */
const grid = document.getElementById("gamesGrid");

games.forEach(g=>{
    const a = document.createElement("a");
    a.className="card";
    a.href=g.link;

    a.innerHTML=`
        <img src="${g.img}">
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
    `;

    grid.appendChild(a);
});
</script>

</body>
</html>
